name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daymark-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daymark
  DIRECT_URL: ""
  API_PORT: "4000"
  WEB_ORIGIN: http://localhost:3000
  SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-at-least-32-characters
  JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-never-use-in-production
  NEXT_PUBLIC_API_URL: http://localhost:4000/v1

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
